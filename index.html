<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrossel de Imagens e Vídeos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      .swiper-container {
        width: 100%;
        height: 100vh; /* Ocupa a tela inteira */
      }
      .swiper-slide {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%; /* Ajusta a altura para ocupar todo o espaço disponível */
        transition: transform 0.5s ease;
      }
      .swiper-slide img {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        animation: zoomEffect 8s ease infinite; /* Zoom automático */
      }
      /* Animação de zoom */
      @keyframes zoomEffect {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        } /* Zoom suave */
        100% {
          transform: scale(1);
        }
      }
      /* Estilos para o vídeo */
      .swiper-slide video {
        max-width: 80%;
        max-height: 80%;
      }
      /* Escondendo os controles */
      .swiper-pagination,
      .swiper-button-next,
      .swiper-button-prev {
        display: none;
      }
      /* Regras de CSS responsivo */
      @media (max-width: 600px) {
        .swiper-slide img,
        .swiper-slide video {
          max-width: 100%;
          max-height: 100%;
        }
      }
      @media (min-width: 601px) and (max-width: 1200px) {
        .swiper-slide img,
        .swiper-slide video {
          max-width: 90%;
          max-height: 90%;
        }
      }
      @media (min-width: 1201px) {
        .swiper-slide img,
        .swiper-slide video {
          max-width: 80%;
          max-height: 80%;
        }
      }
    </style>
  </head>
  <body>
    <div class="swiper-container">
      <div class="swiper-wrapper">
        <!-- Slides serão adicionados aqui via JavaScript -->
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
    <script>
      const swiper = new Swiper('.swiper-container', {
        autoplay: {
          delay: 5000, // Tempo para as imagens
          disableOnInteraction: false,
        },
        loop: false, // Desativar loop inicialmente
      });

      const loadContent = async () => {
        const response = await fetch('https://api.github.com/repos/tuesbela/imagenstv/contents/midia?ref=main');
        const files = await response.json();

        files.forEach((file) => {
          const slide = document.createElement('div');
          slide.classList.add('swiper-slide');
          // Adiciona imagem
          slide.innerHTML = `<img src="${file.download_url}" alt="${file.name}">`;
          swiper.appendSlide(slide);
        });

        // Verifica se há slides suficientes para ativar o loop
        if (files.length > 1) {
          swiper.params.loop = true;
          swiper.loopCreate();
          swiper.update();
        }
      };

      loadContent();
    </script>
  </body>
</html>
